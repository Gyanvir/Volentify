name: Volentify Mesh APK

# Builds the Android relay app and publishes it as a GitHub release asset:
#   https://github.com/<owner>/<repo>/releases/latest/download/volentify-mesh.apk
#
# Optional repository secrets for a stable release signature (otherwise the debug key is used):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional repository variable: VOLENTIFY_SERVER_URL (default server the app uploads to); falls back to VOLENTIFY_URL,
# the same variable the Live feeds workflow uses, so one setting points both at the deployed site.

on:
  push:
    branches: [main]
    paths: ["mesh-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 images ship the Android SDK (ANDROID_HOME); pinned so the image migration doesn't break builds.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mesh-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VOLENTIFY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests and release build
        env:
          VOLENTIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VOLENTIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOLENTIFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VOLENTIFY_SERVER_URL: ${{ vars.VOLENTIFY_SERVER_URL || vars.VOLENTIFY_URL }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compiler/test errors as annotations so they are readable from the API.
            grep -E "^e: |error:|FAILED|What went wrong|Could not|Unresolved|Exception" "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/volentify-mesh.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: volentify-mesh-apk
          path: ${{ runner.temp }}/volentify-mesh.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesh-v1.0.${{ github.run_number }}
          name: Volentify Mesh 1.0.${{ github.run_number }}
          make_latest: true
          files: ${{ runner.temp }}/volentify-mesh.apk
          body: |
            Install on Android 8.0 or newer: download volentify-mesh.apk on the phone, open it and allow installing from this source.
            Then open Settings in the app and paste a gateway token from your Volentify dashboard.
